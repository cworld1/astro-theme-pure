# Local-testing convenience only, not used for deployment.
# Run:   docker compose up --build
# Visit: http://localhost:4321

services:
  astro:
    build:
      context: .
      target: dev
    ports:
      - "4321:4321"
    volumes:
      - .:/web
      - /web/node_modules
      - ./dist:/export
    command: >
      sh -c "find /export -mindepth 1 -print -delete &&
        cp -rv /dist/. /export/ &&
        exec bun run dev --host 0.0.0.0"